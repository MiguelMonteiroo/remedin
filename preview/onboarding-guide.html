<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remedin — Conheça o App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green-primary:   #0F6B3A;
      --green-shadow:    #0A4D29;
      --cream:           #F8F4EB;
      --text-dark:       #242019;
      --text-muted:      #6A655C;
      --font: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      
      /* Bento Colors (Tactile World) */
      --bento-menta:     #84DCAE;
      --bento-menta-txt: #0A4D29;
      --bento-peach:     #FFC6A5;
      --bento-peach-txt: #6B3A1E;
      --bento-lilac:     #D4C1FF;
      --bento-lilac-txt: #3C2278;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0A0F14;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      padding: 24px 16px;
    }

    /* ─── PHONE SHELL ─────────────────────────────────── */
    .phone {
      width: 390px;
      height: 844px;
      border-radius: 54px;
      overflow: hidden;
      position: relative;
      box-shadow:
        0 0 0 10px #1c2733,
        0 0 0 12px #111a23,
        0 48px 120px rgba(0,0,0,0.65);
      background: var(--cream);
      display: flex;
      flex-direction: column;
    }

    /* ─── TOP NAV ─────────────────────────────────────── */
    .nav-top {
      padding: 56px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .nav-btn-icon {
      width: 44px; height: 44px;
      border-radius: 22px;
      background: rgba(0,0,0,0.04);
      border: 1px solid rgba(0,0,0,0.03);
      color: var(--text-dark);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .nav-btn-icon:active { transform: scale(0.92); background: rgba(0,0,0,0.08); }
    .nav-spacer { width: 44px; }

    /* ─── MAIN CONTENT ────────────────────────────────── */
    .main-content {
      flex: 1;
      padding: 24px 20px 40px;
      display: flex;
      flex-direction: column;
    }

    /* ─── HEADLINE ────────────────────────────────────── */
    .header-area {
      margin-bottom: 32px;
      animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .headline {
      font-size: 38px;
      font-weight: 900;
      color: var(--text-dark);
      line-height: 1.05;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    /* ─── BENTO GRID ──────────────────────────────────── */
    .bento-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      flex: 1;
    }

    .bento-card {
      border-radius: 28px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      opacity: 0;
      /* Spring Motion: Overshoot forte na escala e Y */
      animation: springIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2), 0 12px 24px rgba(0,0,0,0.04);
    }

    /* Ordem de entrada tátil */
    .bento-card:nth-child(1) { animation-delay: 0.1s; }
    .bento-card:nth-child(2) { animation-delay: 0.2s; }
    .bento-card:nth-child(3) { animation-delay: 0.25s; }

    /* Card Hero (Topo, 2 colunas) */
    .card-hero {
      grid-column: 1 / -1;
      background: var(--bento-menta);
      color: var(--bento-menta-txt);
      min-height: 200px;
      justify-content: flex-end;
    }

    /* Cards Secundários (Base, 1 coluna cada) */
    .card-square-1 {
      background: var(--bento-peach);
      color: var(--bento-peach-txt);
      min-height: 180px;
      justify-content: flex-end;
    }
    
    .card-square-2 {
      background: var(--bento-lilac);
      color: var(--bento-lilac-txt);
      min-height: 180px;
      justify-content: flex-end;
    }

    .bento-title {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
      z-index: 2;
    }

    .bento-desc {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      opacity: 0.85;
      z-index: 2;
    }

    /* BENTO IMAGES (IA ASSETS) */
    .bento-img {
      position: absolute;
      object-fit: contain;
      z-index: 1;
    }

    .card-hero .bento-img {
      width: 160px;
      height: 160px;
      top: 0px;
      right: 0px;
      transform: rotate(10deg);
    }
    
    .card-square-1 .bento-img {
      width: 90px;
      height: 90px;
      top: -10px;
      right: -10px;
      transform: rotate(-5deg);
    }

    .card-square-2 .bento-img {
      width: 90px;
      height: 90px;
      top: -10px;
      right: -10px;
      transform: rotate(5deg);
    }

    /* ─── ANIMATIONS ──────────────────────────────────── */
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(24px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes springIn {
      0% { 
        opacity: 0; 
        transform: translateY(40px) scale(0.9);
      }
      100% { 
        opacity: 1; 
        transform: translateY(0) scale(1);
      }
    }

    /* ─── CTA BUTTON ──────────────────────────────────── */
    .cta-area {
      width: 100%;
      margin-top: 24px;
      animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both;
    }

    .btn-chunky {
      width: 100%;
      height: 64px;
      background: var(--text-dark);
      border: none;
      border-radius: 20px;
      color: #FFF;
      font-family: var(--font);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.01em;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 6px 0 #000;
      transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-chunky:active  { transform: translateY(6px); box-shadow: 0 0 0 #000; }

    .preview-label {
      color: #4A5D70; font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-top: 28px; text-align: center; opacity: 0.7;
    }
  </style>
</head>
<body>
  <div style="display:flex;flex-direction:column;align-items:center;">
    <div class="phone">

      <!-- TOP NAV -->
      <nav class="nav-top">
        <button class="nav-btn-icon" onclick="history.back()" aria-label="Voltar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="nav-spacer"></div>
      </nav>

      <!-- MAIN CONTENT -->
      <main class="main-content">
        
        <div class="header-area">
          <h1 class="headline">Seu cuidado, seu controle.</h1>
        </div>

        <div class="bento-grid">
          
          <!-- Card Hero (Menta) -->
          <div class="bento-card card-hero">
            <svg class="bento-img" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
              <mask id="pill-mask">
                <rect x="45" y="20" width="70" height="120" rx="35" fill="white"/>
              </mask>
              <g mask="url(#pill-mask)">
                <rect x="45" y="20" width="70" height="60" fill="#84DCAE"/>
                <rect x="45" y="80" width="70" height="60" fill="#FFFFFF"/>
                <line x1="45" y1="80" x2="115" y2="80" stroke="#242019" stroke-width="5"/>
              </g>
              <rect x="45" y="20" width="70" height="120" rx="35" fill="none" stroke="#242019" stroke-width="5"/>
              <circle cx="70" cy="105" r="3.5" fill="#242019" />
              <circle cx="90" cy="105" r="3.5" fill="#242019" />
              <path d="M 76 112 Q 80 117 84 112" fill="none" stroke="#242019" stroke-width="3.5" stroke-linecap="round"/>
              <circle cx="64" cy="110" r="4.5" fill="#FFB3B3" />
              <circle cx="96" cy="110" r="4.5" fill="#FFB3B3" />
            </svg>
            <h2 class="bento-title">Rotina<br>Organizada</h2>
            <p class="bento-desc">Cadastre medicamentos e horários num instante.</p>
          </div>

          <!-- Card Square (Peach) -->
          <div class="bento-card card-square-1">
            <svg class="bento-img" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="18" y="18" width="64" height="64" rx="16" fill="#FFE4D1" stroke="#242019" stroke-width="5"/>
              <circle cx="40" cy="45" r="3.5" fill="#242019" />
              <circle cx="60" cy="45" r="3.5" fill="#242019" />
              <path d="M 46 52 Q 50 57 54 52" fill="none" stroke="#242019" stroke-width="3.5" stroke-linecap="round"/>
              <circle cx="34" cy="50" r="4.5" fill="#FFB3B3" />
              <circle cx="66" cy="50" r="4.5" fill="#FFB3B3" />
              <circle cx="76" cy="76" r="16" fill="#84DCAE" stroke="#242019" stroke-width="4"/>
              <path d="M 69 76 L 74 81 L 83 70" fill="none" stroke="#242019" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h2 class="bento-title">Doses de hoje</h2>
            <p class="bento-desc">Controle o agora.</p>
          </div>

          <!-- Card Square (Lilac) -->
          <div class="bento-card card-square-2">
            <svg class="bento-img" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="22" y="26" width="56" height="60" rx="12" fill="#FFFFFF" stroke="#242019" stroke-width="5"/>
              <mask id="cal-mask">
                <rect x="22" y="26" width="56" height="60" rx="12" fill="white"/>
              </mask>
              <g mask="url(#cal-mask)">
                <rect x="22" y="26" width="56" height="18" fill="#E8DFFF"/>
                <line x1="22" y1="44" x2="78" y2="44" stroke="#242019" stroke-width="5"/>
              </g>
              <rect x="22" y="26" width="56" height="60" rx="12" fill="none" stroke="#242019" stroke-width="5"/>
              <rect x="34" y="16" width="6" height="16" rx="3" fill="#FFC6A5" stroke="#242019" stroke-width="4"/>
              <rect x="60" y="16" width="6" height="16" rx="3" fill="#FFC6A5" stroke="#242019" stroke-width="4"/>
              <circle cx="40" cy="65" r="3.5" fill="#242019" />
              <circle cx="60" cy="65" r="3.5" fill="#242019" />
              <path d="M 46 72 Q 50 77 54 72" fill="none" stroke="#242019" stroke-width="3.5" stroke-linecap="round"/>
              <circle cx="34" cy="70" r="4.5" fill="#FFB3B3" />
              <circle cx="66" cy="70" r="4.5" fill="#FFB3B3" />
            </svg>
            <h2 class="bento-title">Seu histórico</h2>
            <p class="bento-desc">Acompanhe a evolução.</p>
          </div>

        </div>

        <!-- CTA -->
        <div class="cta-area">
          <button id="btn-continue" class="btn-chunky" aria-label="Avançar">
            Entendi
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>

      </main>

    </div>
    <p class="preview-label">Remedin · Conheça o App · Tactile Bento Grid</p>
  </div>
</body>
</html>
